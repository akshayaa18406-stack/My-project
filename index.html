<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canteen Management System</title>
 
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
 
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
 
    body { background: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
 
    #splash { position: fixed; inset: 0; background: #ff6f00; display: flex; justify-content: center; align-items: center; z-index: 10; animation: fadeOut 1s ease forwards; animation-delay: 2.5s; }
 
    #logo { width: 150px; animation: zoomLogo 2.5s ease forwards; }
 
    @keyframes zoomLogo { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
 
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
 
    #main { display: none; width: 100%; max-width: 480px; padding: 20px; text-align: center; }
 
    h1 { margin-bottom: 20px; color: #ff6f00; font-weight: 600; }
 
    /* ── Restaurant List ── */
    #restaurantView { }
 
    .section-title { font-size: 15px; font-weight: 600; color: #555; margin-bottom: 14px; }
 
    .restaurant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
 
    .restaurant-card {
      background: #fff8f0;
      border-radius: 18px;
      padding: 16px 10px;
      box-shadow: 0 4px 14px rgba(255,111,0,0.12);
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      text-align: center;
      border: 2px solid transparent;
    }
 
    .restaurant-card:hover { transform: translateY(-4px); box-shadow: 0 8px 22px rgba(255,111,0,0.22); border-color: #ff6f00; }
 
    .restaurant-card .r-icon { font-size: 36px; margin-bottom: 8px; }
 
    .restaurant-card h3 { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 3px; }
 
    .restaurant-card p { font-size: 11px; color: #888; }
 
    /* ── Menu View ── */
    #menuView { display: none; }
 
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff3e0; border: none; color: #ff6f00;
      font-weight: 600; font-size: 13px;
      padding: 8px 16px; border-radius: 20px;
      cursor: pointer; margin-bottom: 16px;
    }
 
    .back-btn:hover { background: #ffe0b2; }
 
    .restaurant-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
 
    .restaurant-header .r-icon-big { font-size: 40px; }
 
    .restaurant-header h2 { font-size: 20px; color: #ff6f00; font-weight: 600; }
 
    .filter-bar { display: flex; justify-content: space-around; background: #fff3e0; padding: 10px; border-radius: 25px; margin-bottom: 20px; }
 
    .filter-btn { border: none; background: transparent; font-weight: 600; font-size: 14px; padding: 8px 18px; border-radius: 20px; cursor: pointer; }
 
    .filter-btn.active { background: #ff6f00; color: white; }
 
    .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
 
    .food-card { background: #ffffff; border-radius: 18px; padding: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); text-align: center; }
 
    .food-card img { width: 70px; margin-bottom: 8px; }
 
    .food-card h4 { font-size: 14px; margin-bottom: 5px; }
 
    .food-card span { font-size: 13px; font-weight: 600; color: #ff6f00; }
 
    .qty-box { margin-top: 8px; display: flex; justify-content: center; align-items: center; gap: 10px; }
 
    .qty-btn { border: none; background: #ff6f00; color: white; padding: 5px 10px; border-radius: 50%; font-size: 16px; cursor: pointer; }
 
    .qty { font-weight: 600; }
 
    footer { margin-top: 30px; font-size: 13px; color: #777; }
  </style>
</head>
<body>
<div id="splash">
  <img id="logo" src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="Canteen Logo" />

        {name:'Masala Tea',      price:15,  type:'veg',    img:'https://cdn-icons-png.flaticon.com/512/590/590749.png'},
        {name:'Cold Coffee',     price:55,  type:'veg',    img:'https://cdn-icons-png.flaticon.com/512/590/590749.png'},
      ],
    ];
 
    // Each restaurant gets its own qty state
    let currentRestaurantIndex = null;
    let restaurantQtys = restaurantMenus.map(menu => menu.map(() => 0));
 
    // Render restaurant cards
    function renderRestaurants() {
      const grid = document.getElementById('restaurantGrid');
      grid.innerHTML = restaurants.map((r, i) => `
        <div class="restaurant-card" onclick="openRestaurant(${i})">
          <div class="r-icon">${r.icon}</div>
          <h3>${r.name}</h3>
          <p>${r.tag}</p>
        </div>
      `).join('');
    }
 
    function openRestaurant(i) {
      currentRestaurantIndex = i;
      document.getElementById('restaurantView').style.display = 'none';
      document.getElementById('menuView').style.display = 'block';
      document.getElementById('menuRestaurantName').innerText = restaurants[i].name;
      document.getElementById('menuIcon').innerText = restaurants[i].icon;
 
      // Reset filter
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.filter-btn')[0].classList.add('active');
 
      renderFoods(restaurantMenus[i]);
    }
 
    function goBack() {
      document.getElementById('menuView').style.display = 'none';
      document.getElementById('restaurantView').style.display = 'block';
      currentRestaurantIndex = null;
    }
 
    function renderFoods(list) {
      const ri = currentRestaurantIndex;
      const menu = restaurantMenus[ri];
      const grid = document.getElementById('foodGrid');
      grid.innerHTML = list.map((f) => {
        const trueIndex = menu.indexOf(f);
        return `
        <div class="food-card">
          <img src="${f.img}">
          <h4>${f.name}</h4>
          <span>₹${f.price}</span>
          <div class="qty-box">
            <button class="qty-btn" onclick="decreaseQty(${trueIndex})">−</button>
            <div class="qty" id="qty${trueIndex}">${restaurantQtys[ri][trueIndex]}</div>
            <button class="qty-btn" onclick="increaseQty(${trueIndex})">+</button>
          </div>
        </div>`;
      }).join('');
    }
 
    function increaseQty(i) {
      restaurantQtys[currentRestaurantIndex][i]++;
      document.getElementById('qty' + i).innerText = restaurantQtys[currentRestaurantIndex][i];
    }
 
    function decreaseQty(i) {
      if (restaurantQtys[currentRestaurantIndex][i] > 0)
        restaurantQtys[currentRestaurantIndex][i]--;
      document.getElementById('qty' + i).innerText = restaurantQtys[currentRestaurantIndex][i];
    }
 
    function filterMenu(type) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const menu = restaurantMenus[currentRestaurantIndex];
      if (type === 'all') renderFoods(menu);
      else renderFoods(menu.filter(f => f.type === type));
    }
 
    renderRestaurants();
  </script>
 
</body>
</html>
